name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: quickdrop
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quickdrop"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DATABASE_URL: postgres://app_user:app_dev_password@localhost:5432/quickdrop
      DATABASE_URL_MIGRATOR: postgres://migrator:migrator_dev_password@localhost:5432/quickdrop
      DATABASE_URL_WORKER: postgres://app_worker:worker_dev_password@localhost:5432/quickdrop
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bootstrap database roles
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d quickdrop -v ON_ERROR_STOP=1 -f infra/compose/initdb/01-roles.sql

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate (as migrator)
        run: pnpm db:migrate

      # §2.3 — الحارس: جدول أعمال بلا RLS مفعّل ومُجبَر = فشل الـ CI
      - name: RLS coverage check
        run: pnpm db:check-rls

      # §15 — أهم اختبار بالمشروع: عزل المستأجرين يعمل بكل CI
      - name: Tests
        run: pnpm test

      # 8.3-2 — فاتورة المراقبة: طلب delivered بلا قيود دفتره = فشل الـ CI
      - name: Ledger invariants check
        run: pnpm --filter @quickdrop/db check-invariants
