name: quickdrop-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: quickdrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 عالمضيف — 5432 محجوز عادةً لـ PostgreSQL أصلي مركّب على الجهاز.
      # §11 — loopback فقط: 0.0.0.0 يكشف Postgres (بباسورد dev ثابت) لأي شبكة عليها المطوّر.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quickdrop"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      # §11 — loopback فقط: Redis dev بلا باسورد؛ كشفه على 0.0.0.0 = وصول غير مصادَق
      # لمخزن الجلسات/الطوابير من أي شبكة. الإنتاج على شبكة داخلية بلا ports.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
